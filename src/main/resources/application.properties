spring.application.name=debate-arena
server.port=${PORT:8080}

# --- Database (SQLite file, created on first start) ---------------------------
spring.datasource.url=jdbc:sqlite:${DEBATE_DB_PATH:debate.db}?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer - one pooled connection avoids "database is locked".
spring.datasource.hikari.maximum-pool-size=1

# --- JPA / Hibernate ----------------------------------------------------------
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Schema is owned by explicit SQL (db/schema.sql), not generated by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Schema + seed data -------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
# Trigger bodies contain ';' so statements in the SQL files are separated by ';;'
spring.sql.init.separator=;;
